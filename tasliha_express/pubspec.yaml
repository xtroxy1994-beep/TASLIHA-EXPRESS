name: tasliha_express
description: Tasliha Express - Professional Home Services App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4
  firebase_messaging: ^14.9.2

  # State Management
  provider: ^6.1.2

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_rating_bar: ^4.0.1
  intl: 0.20.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  pin_code_fields: ^8.0.1
  flutter_spinkit: ^5.2.1

  # Utils
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  uuid: ^4.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Networking / Email
  http: ^1.2.1
  mailer: ^6.1.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
